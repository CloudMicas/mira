# 生产部署：只跑 mira-server 容器
# 前端由宿主机 nginx 托管 dist 静态文件，反代 /ws 与资源到 127.0.0.1:3001
services:
  mira-server:
    image: ccr.ccs.tencentyun.com/zhuoyun/mira-server:latest
    container_name: mira-server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
    ports:
      # 只绑回环地址，仅供宿主机 nginx 反代，不暴露公网
      - "127.0.0.1:3001:3001"
